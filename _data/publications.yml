- title: "EdgeLLM-Glove: A Decoupled Perception–Cognition Framework for Continuous Sign-to-Text Interaction via Wearable Sensing"
  authors:
    - "Bo Yang"
    - "Wenhua Bai"
    - "Tiefeng Cheng"
    - "Ruofei Liu"
    - "Xuecheng Qu"
    - "Junyao Shen"
    - "Linhong Ji"
    - "Zhou Li"
    - "Jia Cheng"
  status: "Under review"
  type: "Manuscript"
  corresponding_authors: ["Zhou Li", "Jia Cheng"]
  description: "This work presents EdgeLLM-Glove, a wearable sign-to-text system based on a decoupled perception–cognition architecture. By integrating adaptive segmentation, lightweight gloss recognition, and local language reconstruction, the system enables real-time decoding and text conversion of continuous sign language signals without cloud processing, as demonstrated in end-to-end evaluations."

