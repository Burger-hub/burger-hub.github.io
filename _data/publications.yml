  image: "/images/publications/sensory-rehabilitation-ring-overview.webp"
  image_alt: "Overview of the TSPF-Ring, synchronized visual and tactile feedback, tactile sensing, pneumatic actuation and ring fabrication."
  image_width: 1900
  image_height: 2368
  description: "This work introduces a wearable ring that integrates triboelectric sensing and pneumatic feedback for synchronized visual-tactile rehabilitation training. The system detects pressure, proximity, and texture, while EEG experiments show increased sensorimotor-cortex activation during synchronized stimulation."

