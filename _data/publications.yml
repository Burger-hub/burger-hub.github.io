  description: "This work combines flexible triboelectric tactile sensing with multichannel electrical stimulation to provide closed-loop feedback for prosthetic hands. In simulated prosthetic-hand experiments without visual or auditory cues, participants used the feedback to regulate grip force, maintain stable grasping, and distinguish surface textures."

