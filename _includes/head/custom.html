{% include base_path %}

<!-- start custom head snippets -->

<link rel="stylesheet" href="{{ base_path }}/assets/css/academic-profile.css?v={{ site.time | date: '%s' }}">

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- Portrait icons generated from Bo Yang's profile photo. -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v={{ site.time | date: '%s' }}"/>
<link rel="icon" type="image/x-icon" href="{{ base_path }}/images/favicon.ico?v={{ site.time | date: '%s' }}" sizes="16x16 32x32 48x48"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v={{ site.time | date: '%s' }}" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png?v={{ site.time | date: '%s' }}" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json?v={{ site.time | date: '%s' }}"/>
<meta name="theme-color" content="var(--global-bg-color)"/>

<!-- end custom head snippets -->
